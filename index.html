<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Empresarial</title>  <!-- PWA -->  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background:#0f172a; color:#e5e7eb; margin:0; padding:0 }
    header { padding:16px; background:#020617; font-size:20px }
    main { padding:16px }
    button { padding:10px 14px; border-radius:8px; border:none; background:#2563eb; color:white; font-size:16px }
    .hidden { display:none }
    .card { background:#020617; padding:16px; border-radius:12px; margin-top:16px }
  </style></head>
<body><header>📊 Control Empresarial</header><main>
  <div id="loginBox" class="card">
    <p>Inicia sesión para continuar</p>
    <button id="loginBtn">Iniciar sesión con Google</button>
  </div>  <div id="adminPanel" class="card hidden">
    <h2>Panel Administrador</h2>
    <p>Acceso concedido ✔</p>
    <button id="logoutBtn">Cerrar sesión</button>
  </div>
</main><!-- Firebase SDK --><script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  /* ==========================
     CONFIGURACIÓN FIREBASE
     ========================== */
  const firebaseConfig = {
    apiKey: "AIzaSyAROYRdKZFcz8uNZpIB3Dj36_dkHn",
    authDomain: "control-empresarial-74357.firebaseapp.com",
    projectId: "control-empresarial-74357",
    storageBucket: "control-empresarial-74357.appspot.com",
    messagingSenderId: "230947899994",
    appId: "1:230947899994:web:c70241acac6cc8a1",
    measurementId: "G-YECK6WFS8R"
  };

  /* ==========================
     INICIALIZACIÓN
     ========================== */
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  /* ==========================
     ELEMENTOS UI
     ========================== */
  const loginBox = document.getElementById('loginBox');
  const adminPanel = document.getElementById('adminPanel');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  /* ==========================
     LOGIN
     ========================== */
  loginBtn.onclick = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert('Error al iniciar sesión');
      console.error(e);
    }
  };

  logoutBtn.onclick = async () => {
    await signOut(auth);
  };

  /* ==========================
     VERIFICAR ADMIN
     ========================== */
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      loginBox.classList.remove('hidden');
      adminPanel.classList.add('hidden');
      return;
    }

    const ref = doc(db, 'admin', user.email);
    const snap = await getDoc(ref);

    if (snap.exists() && snap.data().role === 'admin') {
      loginBox.classList.add('hidden');
      adminPanel.classList.remove('hidden');
    } else {
      alert('No tienes permisos de administrador');
      await signOut(auth);
    }
  });
</script></body>
</html>
